name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint & typecheck & tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: prediction
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s
          --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Build all packages
        run: pnpm build
      - name: Typecheck
        run: pnpm typecheck
      - name: Typecheck test suites
        run: pnpm typecheck:tests && pnpm typecheck:e2e
      - name: Run tests (apps/packages)
        run: pnpm test
      - name: Foundry tests
        run: pnpm --filter @pl/contracts test
      - name: Format check
        run: pnpm format:check

  # No deployment on normal PRs. Mainnet deployment is a separate manually
  # approved workflow (see deploy-mainnet.yml) gated behind an environment.
