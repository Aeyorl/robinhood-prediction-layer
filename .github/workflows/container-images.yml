name: Backend container images

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "apps/api/**"
      - "apps/worker/**"
      - "packages/chain-config/**"
      - "packages/config/**"
      - "packages/database/**"
      - "packages/sdk/**"
      - "packages/types/**"
      - "Dockerfile"
      - ".dockerignore"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"

permissions:
  contents: read
  id-token: write
  packages: write

concurrency:
  group: backend-images-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [api, worker, migrate]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: arn:aws:iam::498287372410:role/prediction-layer-production-github-images
          aws-region: eu-west-1
      - uses: aws-actions/amazon-ecr-login@v2
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: |
            ghcr.io/mag7-vault/prediction-layer-${{ matrix.service }}
            498287372410.dkr.ecr.eu-west-1.amazonaws.com/prediction-layer/${{ matrix.service }}
          tags: |
            type=sha,format=long
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: ${{ matrix.service }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
