AWSTemplateFormatVersion: "2010-09-09"
Description: Prediction Layer production container foundation in eu-west-1.

Resources:
  GitHubOidcProvider:
    Type: AWS::IAM::OIDCProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList:
        - sts.amazonaws.com
      ThumbprintList:
        - 6938fd4d98bab03faadb97b34396831e3780aea1
      Tags:
        - Key: Product
          Value: prediction-layer
        - Key: Environment
          Value: production

  GitHubImageRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: prediction-layer-production-github-images
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Ref GitHubOidcProvider
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                token.actions.githubusercontent.com:sub: repo:Aeyod7@234510671/robinhood-prediction-layer@1356669085:ref:refs/heads/main
      Policies:
        - PolicyName: PushPredictionLayerImages
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: ecr:GetAuthorizationToken
                Resource: "*"
              - Effect: Allow
                Action:
                  - ecr:BatchCheckLayerAvailability
                  - ecr:BatchGetImage
                  - ecr:CompleteLayerUpload
                  - ecr:GetDownloadUrlForLayer
                  - ecr:InitiateLayerUpload
                  - ecr:PutImage
                  - ecr:UploadLayerPart
                Resource:
                  - !GetAtt ApiRepository.Arn
                  - !GetAtt WorkerRepository.Arn
                  - !GetAtt MigrateRepository.Arn
      Tags:
        - Key: Product
          Value: prediction-layer
        - Key: Environment
          Value: production

  ApiRepository:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: prediction-layer/api
      ImageTagMutability: IMMUTABLE
      ImageScanningConfiguration:
        ScanOnPush: true
      LifecyclePolicy:
        LifecyclePolicyText: >-
          {"rules":[{"rulePriority":1,"description":"Expire untagged images","selection":{"tagStatus":"untagged","countType":"sinceImagePushed","countUnit":"days","countNumber":14},"action":{"type":"expire"}},{"rulePriority":2,"description":"Keep the newest 30 images","selection":{"tagStatus":"any","countType":"imageCountMoreThan","countNumber":30},"action":{"type":"expire"}}]}
      Tags:
        - Key: Product
          Value: prediction-layer
        - Key: Environment
          Value: production

  WorkerRepository:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: prediction-layer/worker
      ImageTagMutability: IMMUTABLE
      ImageScanningConfiguration:
        ScanOnPush: true
      LifecyclePolicy:
        LifecyclePolicyText: >-
          {"rules":[{"rulePriority":1,"description":"Expire untagged images","selection":{"tagStatus":"untagged","countType":"sinceImagePushed","countUnit":"days","countNumber":14},"action":{"type":"expire"}},{"rulePriority":2,"description":"Keep the newest 30 images","selection":{"tagStatus":"any","countType":"imageCountMoreThan","countNumber":30},"action":{"type":"expire"}}]}
      Tags:
        - Key: Product
          Value: prediction-layer
        - Key: Environment
          Value: production

  MigrateRepository:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: prediction-layer/migrate
      ImageTagMutability: IMMUTABLE
      ImageScanningConfiguration:
        ScanOnPush: true
      LifecyclePolicy:
        LifecyclePolicyText: >-
          {"rules":[{"rulePriority":1,"description":"Expire untagged images","selection":{"tagStatus":"untagged","countType":"sinceImagePushed","countUnit":"days","countNumber":14},"action":{"type":"expire"}},{"rulePriority":2,"description":"Keep the newest 30 images","selection":{"tagStatus":"any","countType":"imageCountMoreThan","countNumber":30},"action":{"type":"expire"}}]}
      Tags:
        - Key: Product
          Value: prediction-layer
        - Key: Environment
          Value: production

  Cluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: prediction-layer-production
      ClusterSettings:
        - Name: containerInsights
          Value: enhanced
      Tags:
        - Key: Product
          Value: prediction-layer
        - Key: Environment
          Value: production

  ApiLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /ecs/prediction-layer/production/api
      RetentionInDays: 30

  WorkerLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /ecs/prediction-layer/production/worker
      RetentionInDays: 30

  MigrationLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /ecs/prediction-layer/production/migrate
      RetentionInDays: 30

  TaskExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: prediction-layer-production-task-execution
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy
      Policies:
        - PolicyName: ReadPredictionLayerSecrets
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - secretsmanager:GetSecretValue
                Resource: !Sub arn:${AWS::Partition}:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:prediction-layer/production/*
      Tags:
        - Key: Product
          Value: prediction-layer
        - Key: Environment
          Value: production

  TaskRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: prediction-layer-production-task
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      Tags:
        - Key: Product
          Value: prediction-layer
        - Key: Environment
          Value: production

Outputs:
  GitHubImageRoleArn:
    Value: !GetAtt GitHubImageRole.Arn
  ClusterArn:
    Value: !GetAtt Cluster.Arn
  TaskExecutionRoleArn:
    Value: !GetAtt TaskExecutionRole.Arn
  TaskRoleArn:
    Value: !GetAtt TaskRole.Arn
  ApiRepositoryUri:
    Value: !GetAtt ApiRepository.RepositoryUri
  WorkerRepositoryUri:
    Value: !GetAtt WorkerRepository.RepositoryUri
  MigrateRepositoryUri:
    Value: !GetAtt MigrateRepository.RepositoryUri
